name: Ultimate_Kernel_Injection_Final_Victory
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Patch_Process
        run: |
          # منح صلاحية التشغيل للملف الذي رفعته أنت
          chmod +x kpimg
          
          # فحص للتأكد من أن الملفات موجودة
          ls -lh kpimg init_boot.img
          
          # تنفيذ عملية الحقن لتعريف Atheros
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Ready
          path: init_boot_atheros.img
