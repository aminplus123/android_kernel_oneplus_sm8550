name: Kernel_Build_Final_Ultimate
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Patch_and_Build
        run: |
          # 1. تنظيف ملفات Kconfig المكسورة بذكاء (حذف الإشارات للملفات المفقودة فقط)
          # سنستهدف الأسطر التي تحتوي على "source" وتشير لملفات oplus المفقودة
          find . -name "Kconfig*" -type f -exec sed -i '/oplus_cpu/d' {} +
          find . -name "Kconfig*" -type f -exec sed -i '/FWUpdate/d' {} +
          
          # 2. البحث عن ملف الإعدادات الصحيح
          CONF=$(find arch/arm64/configs -name "*sm8550*" | head -n 1)
          if [ -z "$CONF" ]; then CONF="arch/arm64/configs/vendor/sm8550_defconfig"; fi
          
          # 3. حقن تعريفات Atheros AR9271
          echo "CONFIG_ATH9K_HTC=y" >> $CONF
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF
          echo "CONFIG_MAC80211=y" >> $CONF
          echo "CONFIG_CFG80211=y" >> $CONF
          
          # 4. بدء البناء مع تجاهل تحذيرات المترجم التي توقف العملية
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- $(basename $CONF)
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error" -j$(nproc)

      - name: Upload_Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_PJA110_Atheros
          path: out/arch/arm64/boot/Image
