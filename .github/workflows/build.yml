name: Ultimate_Kernel_Success_Final
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Download_Correct_x86_Tool
        run: |
          # تحميل نسخة السيرفر (Linux x86_64) لضمان عدم حدوث Exec format error
          curl -L "https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64" -o kpimg_server
          chmod +x kpimg_server
          
          # فحص الحجم للتأكد من أنها النسخة الكاملة (يجب أن تكون > 1.5MB)
          ls -lh kpimg_server

      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # استخدام النسخة الصحيحة التي حملناها للتو
          ./kpimg_server -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
