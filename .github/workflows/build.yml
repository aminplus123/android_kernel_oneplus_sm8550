name: Ultimate_Kernel_Injection_Fixed
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Download_Prebuilt_KernelPatch
        run: |
          # تحميل أداة التعديل المباشر (نسخة جاهزة لتجنب أخطاء Makefile)
          wget https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64 -O kpimg
          chmod +x kpimg
          sudo mv kpimg /usr/local/bin/
          
      - name: Patch_Atheros_Drivers
        run: |
          # التأكد من وجود ملفك في المستودع
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found! Please make sure the file is uploaded to the root directory."
            exit 1
          fi
          
          # عملية الحقن المباشر لتعريف Atheros وتفعيل المكونات اللازمة
          # سنقوم بإضافة سطر الإعدادات للكيرنال مباشرة
          kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros
          path: init_boot_atheros.img
