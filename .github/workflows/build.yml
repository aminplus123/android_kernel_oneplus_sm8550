name: Ultimate_Kernel_Injection_Fixed
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Download_KernelPatch_Direct
        run: |
          # تحميل الأداة مباشرة من الرابط الرسمي الخام
          curl -L https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64 -o kpimg
          # إعطاء صلاحية التنفيذ (chmod 777) لضمان العمل
          chmod +x kpimg
          
      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تشغيل الحقن باستخدام المسار الكامل للمجلد الحالي
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_USB_NET_DRIVERS=y CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros
          path: init_boot_atheros.img
