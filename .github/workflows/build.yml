name: Ultimate_Kernel_Injection
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Setup_Kernel_Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          # تحميل أداة التعديل المباشر
          git clone https://github.com/bmax121/KernelPatch.git
          cd KernelPatch && make && sudo cp kpimg /usr/local/bin/
          
      - name: Patch_Atheros_Drivers
        run: |
          # التأكد من وجود ملفك في المستودع
          if [ ! -f "init_boot.img" ]; then
            echo "Error: Please upload your init_boot.img to the repository first!"
            exit 1
          fi
          
          # حقن دعم Atheros AR9271 مباشرة
          # ملاحظة: سنستخدم الـ Patching لإضافة مسارات التعريفات البرمجية
          kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: Oneplus_Atheros_Kernel
          path: init_boot_atheros.img
