name: Kernel_Build_Final_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Ultimate_Patching
        run: |
          # 1. تنظيف شامل لكل الملفات المفقودة (Oplus و KconfigUpdate)
          find . -name "Kconfig*" -type f | while read file; do
            grep 'source "' "$file" | cut -d'"' -f2 | while read target; do
              if [ ! -f "$target" ]; then
                sed -i "s|source \"$target\"|# source \"$target\"|g" "$file"
              fi
            done
          done

          # 2. تحديد الملف يدوياً (المسار الأكثر احتمالاً في معالجات SM8550)
          # سنحاول البحث عنه وتثبيته في متغير واحد
          CONF="vendor/sm8550_defconfig"
          
          # التأكد من وجود الملف قبل المتابعة
          if [ ! -f "arch/arm64/configs/$CONF" ]; then
             # محاولة البحث عن أي ملف defconfig يحتوي على 8550
             CONF=$(find arch/arm64/configs -name "*8550*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "Selected Config: $CONF"

          # 3. حقن تعريفات Atheros AR9271
          echo "CONFIG_ATH9K_HTC=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/$CONF
          
          # 4. بدء البناء الفعلي
          mkdir -p out
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- $CONF
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload_Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_PJA110_Atheros
          path: out/arch/arm64/boot/Image
