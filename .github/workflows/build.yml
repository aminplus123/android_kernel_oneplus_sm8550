name: Ultimate_Kernel_Success_Fixed_Final
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_KernelPatch_Properly
        run: |
          # تحميل النسخة المخصصة للينكس (x86_64) من رابط مباشر ثابت
          wget https://github.com/bmax121/KernelPatch/releases/download/0.13.0/kpimg-linux -O kpimg
          
          # إعطاء صلاحية التشغيل
          chmod +x kpimg
          
          # فحص حجم الملف (لو الحجم صغير بالبايت يعني التحميل فشل)
          ls -lh kpimg
          file kpimg

      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تنفيذ الحقن
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
