name: Kernel_Build_Emergency_Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Ultimate_Patching
        run: |
          # سكريبت ذكي للبحث عن أي ملف Kconfig مفقود وتعطيله آلياً
          find . -name "Kconfig*" -type f | while read file; do
            # البحث عن الأسطر التي تبدأ بـ source "
            grep 'source "' "$file" | cut -d'"' -f2 | while read target; do
              if [ ! -f "$target" ]; then
                echo "Fixing missing file: $target in $file"
                # وضع علامة # لتعطيل السطر المفقود
                sed -i "s|source \"$target\"|# source \"$target\"|g" "$file"
              fi
            done
          done

          # البحث عن ملف الإعدادات
          CONF=$(find arch/arm64/configs -name "*sm8550*" | head -n 1)
          if [ -z "$CONF" ]; then CONF="arch/arm64/configs/vendor/sm8550_defconfig"; fi
          
          # تفعيل تعريفات Atheros
          echo "CONFIG_ATH9K_HTC=y" >> $CONF
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF
          echo "CONFIG_MAC80211=y" >> $CONF
          echo "CONFIG_CFG80211=y" >> $CONF
          
          # بدء البناء
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- $(basename $CONF)
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload_Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_PJA110_Atheros
          path: out/arch/arm64/boot/Image
