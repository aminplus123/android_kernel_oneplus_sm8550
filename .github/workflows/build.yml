name: GKI_Atheros_Patch_Final
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup_Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git cpio python3 python3-pip
          pip3 install pyelftools

      - name: Download_Stable_GKI
        run: |
          # سنقوم بجلب أداة الحقن المخصصة لتعريفات Atheros
          git clone https://github.com/dabao1955/kernel_build_action.git
          cd kernel_build_action
          
      - name: Build_With_Atheros_Drivers
        run: |
          # هنا سنطلب من السكريبت تفعيل USB_NET و ATH9K_HTC
          echo "CONFIG_USB_NET_DRIVERS=y" >> .config
          echo "CONFIG_ATH9K_HTC=y" >> .config
          echo "CONFIG_CFG80211=y" >> .config
          # سيقوم السيرفر هنا بعملية بناء سريعة جداً للتعريفات فقط
          make -j$(nproc)
          
      - name: Upload_Final_Boot
        uses: actions/upload-artifact@v4
        with:
          name: Patched_Boot_Atheros
          path: out/*.img
