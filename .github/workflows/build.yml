name: Kernel_Build_Final_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Ultimate_Patching
        run: |
          # 1. تنظيف مذهل لجميع الملفات المفقودة (نجحنا فيه سابقاً)
          find . -name "Kconfig*" -type f | while read file; do
            grep 'source "' "$file" | cut -d'"' -f2 | while read target; do
              if [ ! -f "$target" ]; then
                sed -i "s|source \"$target\"|# source \"$target\"|g" "$file"
              fi
            done
          done

          # 2. تحديد مسار ملف الإعدادات بدقة (هنا كان الخطأ الأخير)
          # سنبحث عن الملف ونأخذ مساره الصحيح مهما كان
          CONF_PATH=$(find arch/arm64/configs -name "sm8550_defconfig" | head -n 1)
          CONF_NAME=$(basename $CONF_PATH)
          
          echo "Found config at: $CONF_PATH"

          # 3. تفعيل تعريفات Atheros AR9271
          echo "CONFIG_ATH9K_HTC=y" >> $CONF_PATH
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF_PATH
          echo "CONFIG_MAC80211=y" >> $CONF_PATH
          echo "CONFIG_CFG80211=y" >> $CONF_PATH
          
          # 4. بدء البناء (استخدام المسار الكامل للملف لضمان النجاح)
          mkdir -p out
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- $CONF_NAME
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload_Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_PJA110_Atheros
          path: out/arch/arm64/boot/Image
