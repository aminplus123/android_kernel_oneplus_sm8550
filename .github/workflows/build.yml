name: Ultimate_Atheros_Final_Fix
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Standard_Tool
        run: |
          # تحميل النسخة المخصصة للسيرفر (Linux x86_64) حصراً
          # هذه النسخة حجمها ~2MB وتعمل على معمارية السيرفر
          curl -L "https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64" -o kpimg
          
          chmod +x kpimg
          
          # فحص للتأكد من المعمارية (يجب أن تظهر x86-64)
          ls -lh kpimg
          file kpimg

      - name: Patch_Kernel_Image
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تنفيذ الحقن لتعريف Atheros AR9271
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
