name: Kernel_Build_Final_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Ultimate_Patching
        run: |
          # 1. تنظيف شامل لكل الملفات المفقودة التي عطلت البناء سابقاً
          find . -name "Kconfig*" -type f | while read file; do
            grep 'source "' "$file" | cut -d'"' -f2 | while read target; do
              if [ ! -f "$target" ]; then
                sed -i "s|source \"$target\"|# source \"$target\"|g" "$file"
              fi
            done
          done

          # 2. البحث عن ملف الإعدادات بدقة وحقن تعريفات Atheros فيه مباشرة
          CONF_PATH=$(find arch/arm64/configs -name "*defconfig*" | grep "sm8550" | head -n 1)
          
          if [ -z "$CONF_PATH" ]; then
            echo "Error: Could not find config file automatically."
            exit 1
          fi
          
          echo "Using Config found at: $CONF_PATH"
          
          # تفعيل تعريفات الوايفاي الخارجي Atheros AR9271
          echo "CONFIG_ATH9K_HTC=y" >> $CONF_PATH
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF_PATH
          echo "CONFIG_MAC80211=y" >> $CONF_PATH
          echo "CONFIG_CFG80211=y" >> $CONF_PATH
          
          # 3. بناء الكيرنال باستخدام المسار المباشر لتجنب أخطاء basename
          mkdir -p out
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- $(basename $CONF_PATH)
          make ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload_Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_PJA110_Atheros
          path: out/arch/arm64/boot/Image
