name: Ultimate_Kernel_Injection_Fixed
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Download_KernelPatch_Safe
        run: |
          # تحميل إصدار مستقر برابط مباشر خام (Raw) لضمان عدم تحميل صفحة HTML
          curl -L "https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64" -o kpimg
          
          # التأكد من أن الملف ليس فارغاً (يجب أن يكون حجمه أكثر من 1 ميجا)
          filesize=$(stat -c%s "kpimg")
          if [ $filesize -lt 1000000 ]; then
            echo "Error: Download failed (file too small). Trying alternative..."
            curl -L "https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-v0.20.1-linux-x86_64" -o kpimg
          fi
          
          chmod +x kpimg
          ls -lh kpimg
          
      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تشغيل الحقن بمسار مباشر ومؤكد
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros
          path: init_boot_atheros.img
