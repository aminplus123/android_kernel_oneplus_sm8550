name: Ultimate_Kernel_Success_Fixed
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Setup_Correct_Tool
        run: |
          # تحميل النسخة المخصصة للسيرفرات (Linux x86_64) حصراً
          curl -L "https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64" -o kpimg
          chmod +x kpimg
          
          # التحقق من أن الملف محمل وصحيح (يجب أن يكون حجمه 2.0M تقريباً)
          ls -lh kpimg

      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img is missing!"
            exit 1
          fi
          
          # تنفيذ عملية الحقن
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
