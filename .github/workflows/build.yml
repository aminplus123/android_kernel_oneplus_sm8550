name: Kernel_Patch_Final_Success
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Setup_Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install_KernelPatch_Tool
        run: |
          # تثبيت الأداة رسمياً من المستودع المباشر
          # هذه الخطوة تضمن بناء النسخة الصحيحة للسيرفر تلقائياً
          go install github.com/bmax121/KernelPatch/cmd/kpimg@latest
          
          # نقل الأداة للمجلد الرئيسي لتسهيل استخدامها
          cp $(go env GOPATH)/bin/kpimg .
          chmod +x kpimg
          
          # التأكد من وجود الأداة ومعماريتها
          ls -lh kpimg
          file kpimg

      - name: Patch_Kernel
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تنفيذ الحقن لتعريف Atheros AR9271
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Ready
          path: init_boot_atheros.img
