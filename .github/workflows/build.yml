name: Ultimate_Kernel_Success_Final_Verdict
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Correct_X86_64_Tool
        run: |
          # تحميل النسخة المخصصة حصراً لمعمارية السيرفر (linux-x86_64)
          # هذا الملف حجمه حوالي 1.9MB وليس 176KB
          wget https://github.com/bmax121/KernelPatch/releases/download/0.13.0/kpimg-v0.13.0-linux-x86_64 -O kpimg
          
          chmod +x kpimg
          
          # فحص للتأكد من المعمارية (يجب أن تظهر x86-64)
          ls -lh kpimg
          file kpimg

      - name: Patch_Atheros_Drivers
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # تنفيذ الحقن باستخدام الأداة الصحيحة
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
