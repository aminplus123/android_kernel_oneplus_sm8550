name: Ultimate_Kernel_Injection_Final_Fix
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Patch_Atheros_Drivers
        run: |
          # التأكد من وجود ملف الأداة kpimg وملف الإقلاع
          if [ ! -f "kpimg" ]; then
            echo "Error: kpimg tool not found in repository root!"
            exit 1
          fi
          
          # إعطاء صلاحية التشغيل
          chmod +x kpimg
          
          # تنفيذ عملية الحقن لتعريف AR9271
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros
          path: init_boot_atheros.img
