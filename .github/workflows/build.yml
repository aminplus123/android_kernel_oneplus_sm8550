name: Python_Kernel_Injector_Final
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Patch_Using_Python
        run: |
          # كتابة سكربت الحقن الذكي
          cat << 'EOF' > patch_script.py
          import os

          target_file = "init_boot.img"
          output_file = "init_boot_atheros.img"
          config_to_add = b"\nCONFIG_ATH9K_HTC=y\n"

          if os.path.exists(target_file):
              with open(target_file, "rb") as f:
                  data = f.read()
              
              # إضافة الإعداد في نهاية الملف (طريقة الحقن المباشر)
              with open(output_file, "wb") as f:
                  f.write(data + config_to_add)
              print("Successfully injected Atheros config into kernel image!")
          else:
              print("Error: init_boot.img not found!")
              exit(1)
          EOF

          # تشغيل السكربت
          python3 patch_script.py

      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Final
          path: init_boot_atheros.img
