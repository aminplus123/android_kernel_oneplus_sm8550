name: Compile_And_Patch_Atheros_Final
on:
  workflow_dispatch:

jobs:
  build_and_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Setup_Go_Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build_KPIMG_From_Source
        run: |
          # تحميل الكود المصدري
          git clone https://github.com/bmax121/KernelPatch.git
          cd KernelPatch
          
          # البحث عن مجلد المكون الأساسي وبناؤه (تصحيح خطأ المسار)
          find . -name "go.mod" # للتأكد من مكان ملف المشروع
          cd cmd/kpimg || cd kpimg || echo "Searching for directory..."
          
          go build -o ../../kpimg_final main.go || go build -o ../../kpimg_final
          cd ../..
          chmod +x kpimg_final
          ls -lh kpimg_final

      - name: Patch_Kernel_Image
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found!"
            exit 1
          fi
          
          # استخدام الأداة التي بنيناها للتو
          ./kpimg_final -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Compiled
          path: init_boot_atheros.img
