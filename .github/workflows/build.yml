name: Kernel_Build_Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Install_Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -p bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Patch_and_Build
        run: |
          # 1. تجاوز ملف Kconfig المفقود الذي يسبب الفشل
          # هذا الأمر يحذف السطر الذي يطلب ملف oplus_cpu/thermal
          sed -i '/kernel\/oplus_cpu\/thermal\/Kconfig/d' init/Kconfig
          
          # 2. البحث التلقائي عن ملف الإعدادات الخاص بـ SM8550
          CONF=$(find arch/arm64/configs -name "*sm8550*" | head -n 1)
          if [ -z "$CONF" ]; then CONF="arch/arm64/configs/vendor/sm8550_defconfig"; fi
          
          echo "Found Config at: $CONF"
          
          # 3. تفعيل تعريفات Atheros للوايفاي الخارجي
          echo "CONFIG_ATH9K_HTC=y" >> $CONF
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF
          echo "CONFIG_MAC80211=y" >> $CONF
          echo "CONFIG_CFG80211
