name: Build OnePlus SM8550 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm crossbuild-essential-arm64

      - name: Configure Kernel (Add Atheros Support)
        run: |
          CONF_PATH="arch/arm64/configs/vendor/sm8550_defconfig"
          echo "CONFIG_ATH9K_HTC=y" >> $CONF_PATH
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $CONF_PATH
          echo "CONFIG_MAC80211=y" >> $CONF_PATH
          echo "CONFIG_CFG80211=y" >> $CONF_PATH

      - name: Build Kernel
        run: |
          make ARCH=arm64 O=out vendor/sm8550_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Image_PJA110
          path: out/arch/arm64/boot/Image
