name: Ultimate_Kernel_Injection_Fixed
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Download_KernelPatch_Tool
        run: |
          # تحميل الأداة مباشرة من المستودع الرسمي وتسميتها
          curl -L https://github.com/bmax121/KernelPatch/releases/download/0.20.1/kpimg-v0.20.1-linux-x86_64 -o kpimg
          # منح صلاحيات التنفيذ للملف المحمل
          chmod +x kpimg
          # عرض تفاصيل الملف للتأكد من حجمه وسلامته في السجل
          ls -l kpimg
          
      - name: Patch_Atheros_Drivers
        run: |
          # التحقق من وجود ملف الـ init_boot المرفوع مسبقاً
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found in repository root!"
            exit 1
          fi
          
          # تنفيذ عملية الحقن باستخدام المسار المباشر للأداة
          ./kpimg -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Final_Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros
          path: init_boot_atheros.img
