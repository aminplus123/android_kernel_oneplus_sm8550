name: Ultimate_Atheros_Success
on:
  workflow_dispatch:

jobs:
  build_and_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Source
        uses: actions/checkout@v4

      - name: Setup_Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Compile_Tool_Locally
        run: |
          # تحميل الكود المصدري للمشروع
          git clone https://github.com/bmax121/KernelPatch.git
          cd KernelPatch
          
          # بناء الأداة من المجلد الرئيسي للمشروع (أكثر أماناً)
          go build ./cmd/kpimg
          
          # نقل الأداة الناتجة إلى المجلد الرئيسي
          mv kpimg ../kpimg_final
          cd ..
          chmod +x kpimg_final
          
          # فحص الحجم والمعمارية للتأكد
          ls -lh kpimg_final
          file kpimg_final

      - name: Patch_Kernel_Image
        run: |
          if [ ! -f "init_boot.img" ]; then
            echo "Error: init_boot.img not found in repository!"
            exit 1
          fi
          
          # تنفيذ عملية الحقن لتعريف Atheros
          ./kpimg_final -i init_boot.img -o init_boot_atheros.img --patch-config "CONFIG_ATH9K_HTC=y"
          
      - name: Upload_Result
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_Ace2Pro_Atheros_Ready
          path: init_boot_atheros.img
